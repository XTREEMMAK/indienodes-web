# Local convenience; Infra can deploy the same image with its own orchestration.
services:
  indienodes-web:
    image: indienodes-web
    container_name: indienodes-web
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    ports:
      - "${PORT:-8080}:8080"
